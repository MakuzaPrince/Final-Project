version: '3.9'

# ── RideShare Production Stack ────────────────────────────────────────────────
#
# Services:
#   mongodb  → MongoDB 7 database          (port 27017)
#   backend  → Node.js / Express / Socket  (port 5000)
#   frontend → React SPA via nginx         (port 3000)
#
# Usage:
#   1. Copy .env.example → .env  and fill in your values
#   2. docker compose up --build -d
#   3. Open http://localhost:3000
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: rideshare-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: rwanda-ride-system
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rideshare-backend:latest
    container_name: rideshare-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 5000
      # Override MONGO_URI — use container service name, not localhost
      MONGO_URI: mongodb://mongodb:27017/rwanda-ride-system
      JWT_SECRET: ${JWT_SECRET}
      FIREBASE_CREDENTIALS_PATH: ./config/firebase-service-account.json
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      PAYPACK_CLIENT_ID: ${PAYPACK_CLIENT_ID}
      PAYPACK_CLIENT_SECRET: ${PAYPACK_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_PHONE: ${ADMIN_PHONE}
    volumes:
      # Mount Firebase service account key from host (keep secrets out of image)
      - ./backend/config/firebase-service-account.json:/app/config/firebase-service-account.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # These are baked into the Vite build at image build time
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
    image: rideshare-frontend:latest
    container_name: rideshare-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  # ── Ngrok ───────────────────────────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "http://frontend:80"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - frontend

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
