version: '3.9'

# ── RideShare Development Stack ───────────────────────────────────────────────
#
# Hot-reload development mode — source is mounted as a volume so changes
# are reflected instantly without rebuilding images.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: rideshare-db-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    environment:
      MONGO_INITDB_DATABASE: rwanda-ride-system

  # ── Backend (nodemon hot-reload) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: rideshare-backend-dev:latest
    container_name: rideshare-backend-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/rwanda-ride-system
      JWT_SECRET: ${JWT_SECRET}
      FIREBASE_CREDENTIALS_PATH: ./config/firebase-service-account.json
      CLIENT_URL: http://localhost:5173
      PAYPACK_CLIENT_ID: ${PAYPACK_CLIENT_ID}
      PAYPACK_CLIENT_SECRET: ${PAYPACK_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_PHONE: ${ADMIN_PHONE}
      NODE_ENV: development
    volumes:
      # Live source mount — changes trigger nodemon restart
      - ./backend:/app
      # Exclude node_modules from the mount (use container's installed modules)
      - /app/node_modules
      - ./backend/config/firebase-service-account.json:/app/config/firebase-service-account.json:ro

  # ── Frontend (Vite dev server with HMR) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: rideshare-frontend-dev:latest
    container_name: rideshare-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
      VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data_dev:
    driver: local
